<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GAME OVER | 長屋晴太 Portfolio</title>
<link rel="icon" type="image/png" sizes="32x32" href="/portfolio/images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Noto+Sans+JP:wght@400..900&display=swap">
<style>
    :root {
        --ink: #111713;
        --sub: #5b6560;
        --line: #e1e7ef;
        --panel: #f5f8fc;
        --red: #d6363d;
        --red-edge: #a8262c;
        --dots: radial-gradient(rgba(17, 23, 19, .08) 1px, transparent 1.4px) 0 0 / 22px 22px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px 16px;
        background:
            radial-gradient(circle at 50% 10%, rgba(214, 54, 61, .12), transparent 45%),
            radial-gradient(circle at 90% 90%, rgba(0, 163, 224, .1), transparent 40%),
            var(--dots),
            var(--panel);
        color: var(--ink);
        font-family: "Inter", "Noto Sans JP", "Yu Gothic", sans-serif;
        text-align: center;
    }

    main {
        width: min(100%, 680px);
    }

    .stage {
        display: inline-block;
        margin: 0 0 14px;
        padding: 5px 12px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 3px 0 var(--line);
        color: var(--sub);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .2em;
    }

    h1 {
        margin: 0;
        color: var(--red);
        font-size: clamp(3rem, 13vw, 5.6rem);
        font-weight: 900;
        letter-spacing: -.04em;
        line-height: .95;
        text-shadow: 4px 4px 0 var(--ink);
        animation: hit .55s cubic-bezier(.3, 1.6, .5, 1) both;
    }

    .message {
        margin: 18px 0 4px;
        font-size: 1.02rem;
        font-weight: 800;
    }

    .sub {
        margin: 0;
        color: var(--sub);
        font-size: .86rem;
        line-height: 1.8;
    }

    /* ---------- Mini game ---------- */

    .game {
        position: relative;
        margin: 22px 0 0;
        overflow: hidden;
        border: 2px solid var(--ink);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 6px 0 var(--ink), 0 18px 36px rgba(20, 25, 30, .12);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .game-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 14px;
        background: var(--ink);
        color: #fff;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        letter-spacing: .14em;
    }

    .game-bar b {
        color: #ffd54a;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .game-tip {
        margin: 10px 0 0;
        color: var(--sub);
        font-size: .78rem;
    }

    .game-tip kbd {
        padding: 1px 6px;
        border: 1px solid #cfd8e3;
        border-bottom-width: 2px;
        border-radius: 5px;
        background: #fff;
        font-family: inherit;
        font-size: .72rem;
        font-weight: 800;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
    }

    .button {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 22px;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 5px 0 var(--line);
        color: var(--ink);
        font-weight: 800;
        text-decoration: none;
        transition: transform .15s ease;
    }

    .button.is-primary {
        border-color: var(--red);
        background: var(--red);
        box-shadow: 0 5px 0 var(--red-edge);
        color: #fff;
    }

    .button:hover {
        transform: translateY(-2px);
    }

    .button:active {
        transform: translateY(3px);
    }

    .button:focus-visible,
    canvas:focus-visible {
        outline: 3px solid #ffb300;
        outline-offset: 3px;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    @keyframes hit {
        from { opacity: 0; transform: scale(1.8); }
        to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
        h1 {
            animation: none;
        }
    }
</style>
</head>
<body>
<main>
    <p class="stage">ERROR 404 / PAGE NOT FOUND</p>
    <h1>GAME OVER</h1>
    <p class="message">お探しのページは見つかりませんでした。</p>
    <p class="sub">URLが間違っているか、ページが移動した可能性があります。<br>せっかくなので、1回遊んでいきませんか？</p>

    <div class="game">
        <div class="game-bar" aria-hidden="true">
            <span>BONUS STAGE</span>
            <span>SCORE <b id="score">00000</b>　HI <b id="high">00000</b></span>
        </div>
        <canvas id="game" width="720" height="240" tabindex="0" role="img"
            aria-label="ミニゲーム：キャラクターをジャンプさせて、地面を歩く魚をよけるゲームです。スペースキーかタップでジャンプします。"></canvas>
    </div>
    <p class="game-tip"><kbd>SPACE</kbd> / <kbd>↑</kbd> / タップでジャンプ。空を飛ぶ魚はジャンプしないでよけよう。</p>
    <p class="sr-only" id="announce" aria-live="polite"></p>

    <div class="actions">
        <a class="button is-primary" href="/portfolio/">▶ CONTINUE（トップへ）</a>
        <a class="button" href="/portfolio/#other-works">作品一覧を見る</a>
    </div>
</main>

<script>
    /* ========================================
       404 ミニゲーム（キャラクターで障害物をよける）
       - 地面を歩く赤い魚 → ジャンプでよける
       - 空を飛ぶ青い魚（スコア150から）→ ジャンプしないでよける
       - だんだん速くなる。ハイスコアはこのブラウザに保存
    ======================================== */
    (() => {
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highEl = document.getElementById("high");
        const announce = document.getElementById("announce");

        // スマホなど幅が狭いときは、画面を少し近くに寄せる（キャラが小さくなりすぎないように）
        const narrow = canvas.clientWidth < 520;
        const W = narrow ? 460 : 720;
        const H = narrow ? 250 : 240;
        const GROUND = H - 36;
        const GRAVITY = 2600;
        const JUMP = -820;

        // 高解像度の画面でもくっきり描く
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * ratio;
        canvas.height = H * ratio;
        ctx.scale(ratio, ratio);
        ctx.imageSmoothingEnabled = false;

        const load = (name) => {
            const img = new Image();
            img.src = `/portfolio/images/character/${name}.png`;
            return img;
        };
        const sprites = { player: load("Player"), walker: load("RedFish"), flyer: load("Fish") };

        let high = 0;
        try { high = Number(localStorage.getItem("pa-404-high")) || 0; } catch { high = 0; }

        const pad = (n) => String(Math.floor(n)).padStart(5, "0");
        highEl.textContent = pad(high);

        const player = { x: 76, y: GROUND, vy: 0, size: 46 };
        let obstacles = [];
        let clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * (W / 4.5) + 40, y: 30 + (i % 3) * 26, w: 40 + (i % 2) * 24 }));
        let state = "ready";      // ready / play / over
        let speed = 330;
        let score = 0;
        let spawnIn = 1.2;
        let last = 0;
        let blink = 0;

        const reset = () => {
            obstacles = [];
            player.y = GROUND;
            player.vy = 0;
            speed = 330;
            score = 0;
            spawnIn = 1.1;
        };

        const jump = () => {
            if (state === "ready" || state === "over") {
                reset();
                state = "play";
                announce.textContent = "スタート";
            }
            if (player.y >= GROUND) player.vy = JUMP;
        };

        const spawn = () => {
            const flying = score > 150 && Math.random() < 0.35;
            obstacles.push(flying
                ? { kind: "flyer", x: W + 20, y: GROUND - 92 - Math.random() * 14, size: 38, wobble: Math.random() * 6 }
                : { kind: "walker", x: W + 20, y: GROUND, size: 34 + Math.random() * 10, wobble: 0 });
            spawnIn = Math.max(0.55, (0.85 + Math.random() * 0.9) * (330 / speed) * 1.25);
        };

        const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

        const update = (dt) => {
            clouds.forEach((c) => {
                c.x -= speed * 0.15 * dt;
                if (c.x < -80) c.x = W + Math.random() * 60;
            });
            if (state !== "play") return;

            speed = Math.min(780, speed + 14 * dt);
            score += speed * dt * 0.05;

            player.vy += GRAVITY * dt;
            player.y = Math.min(GROUND, player.y + player.vy * dt);
            if (player.y >= GROUND) player.vy = 0;

            spawnIn -= dt;
            if (spawnIn <= 0) spawn();

            const me = { x: player.x + 10, y: player.y - player.size + 8, w: player.size - 20, h: player.size - 10 };
            for (const o of obstacles) {
                o.x -= speed * dt * (o.kind === "flyer" ? 1.15 : 1);
                o.wobble += dt * 8;
                const top = o.kind === "flyer" ? o.y + Math.sin(o.wobble) * 4 : o.y;
                const box = { x: o.x + 7, y: top - o.size + 8, w: o.size - 14, h: o.size - 12 };
                if (hit(me, box)) {
                    state = "over";
                    if (score > high) {
                        high = Math.floor(score);
                        try { localStorage.setItem("pa-404-high", String(high)); } catch { /* ignore */ }
                        highEl.textContent = pad(high);
                        announce.textContent = `ミス！ スコア ${Math.floor(score)}。ハイスコア更新！`;
                    } else {
                        announce.textContent = `ミス！ スコア ${Math.floor(score)}`;
                    }
                    break;
                }
            }
            obstacles = obstacles.filter((o) => o.x > -60);
            scoreEl.textContent = pad(score);
        };

        const drawSprite = (img, x, groundY, size, flip) => {
            if (!img.complete || !img.naturalWidth) {
                ctx.fillStyle = "#111713";
                ctx.fillRect(x, groundY - size, size, size);
                return;
            }
            ctx.save();
            if (flip) {
                ctx.translate(x + size, groundY - size);
                ctx.scale(-1, 1);
                ctx.drawImage(img, 0, 0, size, size);
            } else {
                ctx.drawImage(img, x, groundY - size, size, size);
            }
            ctx.restore();
        };

        const text = (value, y, size, color) => {
            ctx.font = `900 ${size}px Inter, "Noto Sans JP", sans-serif`;
            ctx.textAlign = "center";
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#fff";
            ctx.strokeText(value, W / 2, y);
            ctx.fillStyle = color;
            ctx.fillText(value, W / 2, y);
        };

        const draw = () => {
            ctx.clearRect(0, 0, W, H);

            // 空とドット
            ctx.fillStyle = "#f5f8fc";
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = "#dfe7f1";
            clouds.forEach((c) => {
                ctx.fillRect(c.x, c.y, c.w, 10);
                ctx.fillRect(c.x + 8, c.y - 8, c.w - 16, 8);
            });

            // 地面
            ctx.fillStyle = "#111713";
            ctx.fillRect(0, GROUND, W, 3);
            ctx.fillStyle = "#cfd8e3";
            const offset = (performance.now() / 1000 * (state === "play" ? speed : 60)) % 40;
            for (let x = -offset; x < W; x += 40) ctx.fillRect(x, GROUND + 14, 14, 3);

            // 障害物
            obstacles.forEach((o) => {
                const y = o.kind === "flyer" ? o.y + Math.sin(o.wobble) * 4 : o.y;
                drawSprite(o.kind === "flyer" ? sprites.flyer : sprites.walker, o.x, y, o.size, false);
            });

            // プレイヤー（走っているあいだは少し跳ねる）
            const bob = state === "play" && player.y >= GROUND ? Math.abs(Math.sin(performance.now() / 70)) * 3 : 0;
            drawSprite(sprites.player, player.x, player.y - bob, player.size, false);

            blink += 1;
            if (state === "ready") {
                text("BONUS STAGE", 92, 34, "#d6363d");
                if (Math.floor(blink / 30) % 2 === 0) text("▶ スペース / タップでスタート", 132, 18, "#111713");
            } else if (state === "over") {
                text("MISS!", 92, 40, "#d6363d");
                text(`SCORE ${Math.floor(score)}`, 126, 20, "#111713");
                if (Math.floor(blink / 30) % 2 === 0) text("▶ もう一度（スペース / タップ）", 156, 16, "#5b6560");
            }
        };

        const loop = (time) => {
            const dt = Math.min((time - last) / 1000 || 0, 0.05);
            last = time;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);

        // 操作：スペース・↑・W、または画面をタップ
        document.addEventListener("keydown", (event) => {
            if (!["Space", "ArrowUp", "KeyW"].includes(event.code)) return;
            if (event.target.closest("a") && event.code === "Space") return;
            event.preventDefault();
            jump();
        });
        canvas.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            canvas.focus({ preventScroll: true });
            jump();
        });

        // 別のタブに移ったら一時停止
        document.addEventListener("visibilitychange", () => {
            last = performance.now();
        });
    })();
</script>
</body>
</html>
